<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReemOS - مساحتي الخاصة</title>
<!-- 1. استدعاء خط Cairo من Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box; /* 2. لضبط المقاسات ومنع خروج العناصر عن حدود البطاقة */
  }
  body {
    background: #fff8fb;
    font-family: 'Cairo', sans-serif;
    color: #4a2c3a;
    margin: 0;
    padding: 20px;
  }
  .container { max-width: 900px; margin: auto; }
  h1 { color: #e89bb1; text-align: center; }
  .card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 4px 20px #f8d6e0;
    border: 1px solid #ffe4ec;
  }
  .card h2 { color: #e89bb1; margin-top: 0; }
  
  /* 3. تنسيق الروابط كأزرار مباشرة وفق معايير HTML الحديثة */
  .btn {
    display: inline-block;
    background: #f8a9c0;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-family: 'Cairo', sans-serif;
    transition: background 0.2s ease;
  }
  .btn:hover { background: #e89bb1; }

  textarea {
    width: 100%;
    height: 120px;
    border-radius: 12px;
    border: 1px solid #ffe4ec;
    padding: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    color: #4a2c3a;
    resize: vertical;
    outline: none;
  }
  textarea:focus {
    border-color: #e89bb1;
  }
  .save-status {
    display: block;
    font-size: 12px;
    color: #a87b8c;
    margin-top: 6px;
    text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>💖 ReemOS</h1>

  <div class="card">
    <h2>📚 محاضراتي</h2>
    <p>محاضرة البرمجة - الدرس الأول</p>
    <video width="100%" controls style="border-radius:15px;">
      <source src="YOUR_VIDEO_LINK.mp4" type="video/mp4">
    </video>
    <br><br>
    <a href="YOUR_VIDEO_LINK.mp4" download class="btn">⬇️ تحميل الفيديو</a>
  </div>

  <div class="card">
    <h2>💻 مختبر البرمجة</h2>
    <p>اكتبي وجربي الكود هنا</p>
    <a href="https://vscode.dev" target="_blank" class="btn">افتحي المختبر 🚀</a>
  </div>

  <div class="card">
    <h2>🌸 مساحتنا</h2>
    <p>مساحتك الخاصة للملاحظات والأفكار (تُحفظ تلقائياً)</p>
    <textarea id="notesArea" placeholder="اكتبي هنا..."></textarea>
    <span id="saveStatus" class="save-status">جاهز للحفظ التلقائي ✓</span>
  </div>

</div>

<!-- 4. كود JavaScript لحفظ الملاحظات تلقائياً في المتصفح -->
<script>
  const notesArea = document.getElementById('notesArea');
  const saveStatus = document.getElementById('saveStatus');

  // استرجاع الملاحظات المحفوظة عند فتح الصفحة
  window.addEventListener('DOMContentLoaded', () => {
    const savedNotes = localStorage.getItem('reemOS_notes');
    if (savedNotes) {
      notesArea.value = savedNotes;
    }
  });

  // الحفظ الفوري عند الكتابة
  notesArea.addEventListener('input', () => {
    localStorage.setItem('reemOS_notes', notesArea.value);
    saveStatus.textContent = 'تم الحفظ تلقائياً ✓';
  });
</script>
</body>
</html>
